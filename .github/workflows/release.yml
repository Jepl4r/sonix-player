name: Build HiBy R1 Beta Firmware

on:
  push:
    branches:
      - beta-releases

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hiby-r1-beta-${{ github.ref }}
  cancel-in-progress: false

env:
  # Official HiBy R1 Firmware V1.6 Google Drive folder
  HIBY_R1_V16_FOLDER: https://drive.google.com/drive/folders/1A2RIMdvuZRzGCNMY9F81vtGAAs2FJ46W?usp=sharing

  # Rockbox/R1 build environment
  RBDEV_HOST_PREFIX: ${{ github.workspace }}/sonix-player/rockbox-toolchain
  RBDEV_DOWNLOAD: ${{ github.workspace }}/sonix-player/.cache/rbdev-dl
  RBDEV_BUILD: ${{ github.workspace }}/sonix-player/.cache/rbdev-build
  MAKEFLAGS: -j2

  # Rolling beta release
  LATEST_BETA_RELEASE_TAG: beta-latest

jobs:
  build:
    name: Build HiBy R1 Beta Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout beta-releases branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # VERIFY BRANCH
      # ============================================================
      - name: Verify beta branch
        shell: bash
        run: |
          set -euo pipefail

          echo "Current ref: ${GITHUB_REF}"
          echo "Current branch: ${GITHUB_REF_NAME}"

          if [ "${GITHUB_REF_NAME}" != "beta-releases" ]; then
            echo "ERROR: This workflow must run from beta-releases."
            exit 1
          fi

      # ============================================================
      # INSTALL BUILD DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            autopoint \
            bc \
            bison \
            build-essential \
            bzip2 \
            ca-certificates \
            file \
            flex \
            genisoimage \
            gettext \
            gh \
            git \
            gzip \
            gtk-doc-tools \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            libtool \
            libtool-bin \
            make \
            p7zip-full \
            patch \
            pkg-config \
            python3 \
            python3-venv \
            rsync \
            squashfs-tools \
            tar \
            texinfo \
            unzip \
            wget \
            xz-utils

          echo "Build dependencies installed."

      # ============================================================
      # VERIFY PROJECT STRUCTURE
      # ============================================================
      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f sonix-player/Makefile
          test -f sonix-player/rockboxdev/rockboxdev.sh
          test -d sonix-player/rockboxdev/toolchain-patches

          test -f sonix-packer/sonix_firmware_packer.sh
          test -d sonix-packer/assets/R1

          chmod +x sonix-player/rockboxdev/rockboxdev.sh
          chmod +x sonix-packer/sonix_firmware_packer.sh

          echo "Project structure verified."

      # ============================================================
      # RESTORE ROCKBOX TOOLCHAIN CACHE
      # ============================================================
      - name: Restore Rockbox toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            sonix-player/rockbox-toolchain
            sonix-player/.cache/rbdev-dl
            sonix-player/.cache/rbdev-build
          key: hiby-r1-toolchain-v1-${{ runner.os }}-${{ hashFiles('sonix-player/rockboxdev/rockboxdev.sh', 'sonix-player/rockboxdev/toolchain-patches/**') }}

      # ============================================================
      # RESTORE LIBRARY CACHE
      # ============================================================
      - name: Restore target library cache
        id: libraries-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            sonix-player/freetype-target
            sonix-player/audio-target
            sonix-player/freetype-2.13.3.tar.xz
            sonix-player/libogg-1.3.5.tar.gz
            sonix-player/opus-1.4.tar.gz
            sonix-player/opusfile-0.12.tar.gz
            sonix-player/wavpack-5.6.0.tar.bz2
          key: hiby-r1-libs-v1-${{ runner.os }}-${{ hashFiles('sonix-player/Makefile') }}

      # ============================================================
      # DOWNLOAD OFFICIAL HIBY R1 V1.6
      # ============================================================
      - name: Download official HiBy R1 v1.6
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================"
          echo "DOWNLOADING OFFICIAL HIBY R1 V1.6"
          echo "============================================"

          rm -rf sonix-packer/hiby-v1.6-download
          mkdir -p sonix-packer/hiby-v1.6-download

          python3 -m venv "$RUNNER_TEMP/gdown-env"

          "$RUNNER_TEMP/gdown-env/bin/python" \
            -m pip install --upgrade pip

          "$RUNNER_TEMP/gdown-env/bin/python" \
            -m pip install "gdown==6.4.0"

          echo "gdown version:"
          "$RUNNER_TEMP/gdown-env/bin/gdown" --version

          "$RUNNER_TEMP/gdown-env/bin/gdown" \
            "$HIBY_R1_V16_FOLDER" \
            --output sonix-packer/hiby-v1.6-download \
            --folder

          echo "Downloaded files:"
          find sonix-packer/hiby-v1.6-download \
            -type f \
            -printf '%p\n' \
            | sort

      # ============================================================
      # EXTRACT / FIND r1.upt FROM V1.6
      # ============================================================
      - name: Prepare official R1 v1.6 r1.upt
        shell: bash
        run: |
          set -euo pipefail

          BASE_DIR="sonix-packer/hiby-v1.6-download"
          OUTPUT="sonix-packer/r1_original.upt"

          rm -f "$OUTPUT"

          echo "============================================"
          echo "LOCATING OFFICIAL R1 V1.6 r1.upt"
          echo "============================================"

          DIRECT_UPT=$(find "$BASE_DIR" \
            -type f \
            \( -iname 'r1.upt' -o -iname 'R1.upt' \) \
            -print \
            -quit || true)

          if [ -n "$DIRECT_UPT" ]; then
            echo "Found direct r1.upt:"
            echo "$DIRECT_UPT"
            cp -f "$DIRECT_UPT" "$OUTPUT"
          else
            ZIP_FILE=$(find "$BASE_DIR" \
              -type f \
              \( -iname '*.zip' -o -iname '*.ZIP' \) \
              -print \
              -quit || true)

            if [ -n "$ZIP_FILE" ]; then
              echo "Found firmware ZIP:"
              echo "$ZIP_FILE"

              rm -rf "$RUNNER_TEMP/hiby-r1-v16-extracted"
              mkdir -p "$RUNNER_TEMP/hiby-r1-v16-extracted"

              unzip -o "$ZIP_FILE" \
                -d "$RUNNER_TEMP/hiby-r1-v16-extracted"

              EXTRACTED_UPT=$(find \
                "$RUNNER_TEMP/hiby-r1-v16-extracted" \
                -type f \
                \( -iname 'r1.upt' -o -iname 'R1.upt' \) \
                -print \
                -quit || true)

              if [ -n "$EXTRACTED_UPT" ]; then
                echo "Found r1.upt inside ZIP:"
                echo "$EXTRACTED_UPT"
                cp -f "$EXTRACTED_UPT" "$OUTPUT"
              fi
            fi
          fi

          if [ ! -s "$OUTPUT" ]; then
            TXT_UPT=$(find "$BASE_DIR" \
              -type f \
              \( -iname 'r1.upt.txt' -o -iname 'R1.upt.txt' \) \
              -print \
              -quit || true)

            if [ -n "$TXT_UPT" ]; then
              echo "Found r1.upt.txt:"
              echo "$TXT_UPT"
              cp -f "$TXT_UPT" "$OUTPUT"
            fi
          fi

          if [ ! -s "$OUTPUT" ]; then
            echo "ERROR: Official HiBy R1 v1.6 r1.upt was not found."
            find "$BASE_DIR" -type f -printf '%p\n' | sort
            exit 1
          fi

          echo "============================================"
          echo "OFFICIAL HIBY R1 V1.6 FOUND"
          echo "============================================"

          ls -lh "$OUTPUT"

          echo "File type:"
          file "$OUTPUT"

          echo "SHA256:"
          sha256sum "$OUTPUT"

          echo "Size:"
          stat -c '%s bytes' "$OUTPUT"

          echo "UPT contents:"
          7z l "$OUTPUT"

          7z l "$OUTPUT" | grep -q 'ota_v0'

          echo "Official HiBy R1 v1.6 firmware is ready."


      # ============================================================
      # CREATE / SEAL STREAMING KEYS
      # ============================================================
      - name: Create and seal Last.fm streaming keys
        working-directory: sonix-player
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          set -euo pipefail

          echo "============================================"
          echo "PREPARING LAST.FM STREAMING KEYS"
          echo "============================================"

          test -f streaming-keys.ini.example
          test -f tools/seal_streamkeys.py

          cp -f streaming-keys.ini.example streaming-keys.ini

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("streaming-keys.ini")
          text = path.read_text(encoding="utf-8")

          api_key = os.environ["LASTFM_API_KEY"].strip()
          api_secret = os.environ["LASTFM_API_SECRET"].strip()

          if not api_key:
              raise SystemExit("ERROR: LASTFM_API_KEY GitHub Secret is empty.")
          if not api_secret:
              raise SystemExit("ERROR: LASTFM_API_SECRET GitHub Secret is empty.")

          match = re.search(
              r"(?ms)^\[lastfm\]\s*$.*?(?=^\[[^]]+\]\s*$|\Z)",
              text,
          )

          if not match:
              raise SystemExit(
                  "ERROR: [lastfm] section was not found in streaming-keys.ini.example."
              )

          section = match.group(0)

          if not re.search(r"(?m)^\s*api_key\s*=", section):
              raise SystemExit(
                  "ERROR: api_key entry was not found in the [lastfm] section."
              )

          if not re.search(r"(?m)^\s*api_secret\s*=", section):
              raise SystemExit(
                  "ERROR: api_secret entry was not found in the [lastfm] section."
              )

          section = re.sub(
              r"(?m)^(\s*api_key\s*=\s*).*$",
              lambda m: m.group(1) + api_key,
              section,
              count=1,
          )

          section = re.sub(
              r"(?m)^(\s*api_secret\s*=\s*).*$",
              lambda m: m.group(1) + api_secret,
              section,
              count=1,
          )

          path.write_text(
              text[:match.start()] + section + text[match.end():],
              encoding="utf-8",
          )
          PY

          chmod 600 streaming-keys.ini

          echo "Last.fm credentials inserted into streaming-keys.ini."
          echo "Sealing streaming keys..."

          python3 tools/seal_streamkeys.py seal

          test -s ../sonix-packer/assets/R1/usr/resource/sonix/components/streaming-keys.bin
          test -s ../sonix-packer/assets/R3PII/usr/resource/sonix/components/streaming-keys.bin
          test -s streaming-keys.key

          echo "Streaming keys sealed successfully."
          echo "The credential values themselves are not printed."

      # ============================================================
      # BUILD SONIX PLAYER
      # ============================================================
      - name: Build Sonix Player
        working-directory: sonix-player
        shell: bash
        run: |
          set -uo pipefail

          echo "============================================"
          echo "BUILDING SONIX PLAYER FOR HIBY R1"
          echo "============================================"

          make -j2 BOARD=r1 target
          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "SONIX PLAYER BUILD FAILED"

            find .cache/rbdev-build \
              -type f \
              -name '*.log' \
              -print 2>/dev/null || true

            for LOG in .cache/rbdev-build/build-*.log; do
              [ -f "$LOG" ] || continue

              echo "--------------------------------------------"
              echo "$LOG"
              echo "--------------------------------------------"

              tail -n 250 "$LOG" || true
            done

            exit "$STATUS"
          fi

          test -x sonix_player
          test -s sonix_player

          ls -lh sonix_player
          file sonix_player

      # ============================================================
      # SAVE TOOLCHAIN CACHE
      # ============================================================
      - name: Save Rockbox toolchain cache
        if: success() && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            sonix-player/rockbox-toolchain
            sonix-player/.cache/rbdev-dl
            sonix-player/.cache/rbdev-build
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      # ============================================================
      # SAVE LIBRARY CACHE
      # ============================================================
      - name: Save target library cache
        if: success() && steps.libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            sonix-player/freetype-target
            sonix-player/audio-target
            sonix-player/freetype-2.13.3.tar.xz
            sonix-player/libogg-1.3.5.tar.gz
            sonix-player/opus-1.4.tar.gz
            sonix-player/opusfile-0.12.tar.gz
            sonix-player/wavpack-5.6.0.tar.bz2
          key: ${{ steps.libraries-cache.outputs.cache-primary-key }}

      # ============================================================
      # COPY PLAYER TO PACKER
      # ============================================================
      - name: Prepare Sonix Player for packer
        shell: bash
        run: |
          set -euo pipefail

          cp -f \
            sonix-player/sonix_player \
            sonix-packer/sonix_player

          chmod +x sonix-packer/sonix_player
          chmod +x sonix-packer/sonix_firmware_packer.sh

          test -s sonix-packer/sonix_player
          test -s sonix-packer/r1_original.upt

          echo "Official base:"
          ls -lh sonix-packer/r1_original.upt

          echo "Sonix Player:"
          ls -lh sonix-packer/sonix_player

          echo "SHA256:"
          sha256sum \
            sonix-packer/r1_original.upt \
            sonix-packer/sonix_player

      # ============================================================
      # VERIFY PACKAGING TOOLS
      # ============================================================
      - name: Verify packaging tools
        shell: bash
        run: |
          set -euo pipefail

          for TOOL in \
            7z \
            unsquashfs \
            mksquashfs \
            split \
            tar \
            md5sum \
            sha256sum
          do
            command -v "$TOOL" >/dev/null || {
              echo "Missing tool: $TOOL"
              exit 1
            }
          done

          ISO_TOOL=""

          for TOOL in \
            mkisofs \
            genisoimage \
            xorrisofs
          do
            if command -v "$TOOL" >/dev/null 2>&1; then
              ISO_TOOL="$TOOL"
              break
            fi
          done

          test -n "$ISO_TOOL"

          echo "Packaging tools verified."
          echo "ISO writer: $ISO_TOOL"

      # ============================================================
      # BUILD CUSTOM R1.UPT
      # ============================================================
      - name: Build custom R1 firmware
        working-directory: sonix-packer
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================"
          echo "PACKING SONIX PLAYER INTO HIBY R1 V1.6"
          echo "============================================"

          ./sonix_firmware_packer.sh

          test -s r1.upt

          ls -lh r1.upt
          file r1.upt
          sha256sum r1.upt

      # ============================================================
      # VERIFY CUSTOM UPT
      # ============================================================
      - name: Verify custom R1 firmware
        working-directory: sonix-packer
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================"
          echo "VERIFYING CUSTOM R1.UPT"
          echo "============================================"

          test -f r1.upt
          test -s r1.upt

          SIZE=$(stat -c '%s' r1.upt)

          echo "Size: $SIZE bytes"

          if [ "$SIZE" -lt 1048576 ]; then
            echo "ERROR: r1.upt is unexpectedly small."
            exit 1
          fi

          7z l r1.upt
          7z l r1.upt | grep -q 'ota_v0'

          rm -rf "$RUNNER_TEMP/r1-verify"
          mkdir -p "$RUNNER_TEMP/r1-verify"

          7z x r1.upt \
            -o"$RUNNER_TEMP/r1-verify" \
            -y \
            >/dev/null

          OTA_DIR="$RUNNER_TEMP/r1-verify/ota_v0"

          test -d "$OTA_DIR"
          test -f "$OTA_DIR/ota_update.in"

          echo "ota_update.in:"
          cat "$OTA_DIR/ota_update.in"

          ROOTFS_COUNT=$(
            find "$OTA_DIR" \
              -maxdepth 1 \
              -type f \
              -name 'rootfs.squashfs.*' \
              | wc -l
          )

          echo "Rootfs chunks: $ROOTFS_COUNT"

          if [ "$ROOTFS_COUNT" -lt 1 ]; then
            echo "ERROR: No rootfs chunks found."
            exit 1
          fi

          echo "Custom R1 firmware passed structural validation."

      # ============================================================
      # CREATE RELEASE FILES
      # ============================================================
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp -f \
            sonix-packer/r1.upt \
            release/r1.upt

          cp -f \
            sonix-player/sonix_player \
            release/sonix_player

          sha256sum \
            release/r1.upt \
            release/sonix_player \
            > release/SHA256SUMS

          echo "============================================"
          echo "RELEASE FILES"
          echo "============================================"

          ls -lh release

          echo "SHA256SUMS:"
          cat release/SHA256SUMS

      # ============================================================
      # UPLOAD R1 ARTIFACT
      # ============================================================
      - name: Upload R1 firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: r1-beta-firmware-${{ github.sha }}
          if-no-files-found: error
          path: |
            release/r1.upt
            release/SHA256SUMS
          retention-days: 30

      # ============================================================
      # UPLOAD PLAYER ARTIFACT
      # ============================================================
      - name: Upload Sonix Player artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonix-player-r1-beta-${{ github.sha }}
          if-no-files-found: error
          path: |
            release/sonix_player
          retention-days: 30

      # ============================================================
      # CREATE / UPDATE LATEST BETA RELEASE
      #
      # This behaves like the main workflow:
      #
      #   beta-latest
      #       |
      #       +-- r1.upt
      #       +-- sonix_player
      #       +-- SHA256SUMS
      #
      # Every successful beta build replaces the assets in this
      # same release.
      # ============================================================
      - name: Publish Latest Beta Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="$LATEST_BETA_RELEASE_TAG"
          TITLE="Latest R1 Beta Firmware"

          # --------------------------------------------------------
          # Indian Standard Time
          # --------------------------------------------------------
          IST_TIME=$(TZ=Asia/Kolkata date '+%Y-%m-%d %I:%M:%S %p IST')

          NOTES=$(cat <<EOF
          # Sonix Player for HiBy R1 — Latest Beta

          Automatically generated from the latest successful
          \`beta-releases\` branch build.

          ## Build Information

          - Branch: \`beta-releases\`
          - Commit: \`${GITHUB_SHA}\`
          - Workflow run: \`${GITHUB_RUN_NUMBER}\`
          - Run ID: \`${GITHUB_RUN_ID}\`
          - Build time: \`${IST_TIME}\`
          - Base firmware: Official HiBy R1 Firmware V1.6

          ## Files

          - \`r1.upt\` — latest HiBy R1 beta firmware
          - \`sonix_player\` — Sonix Player executable
          - \`SHA256SUMS\` — SHA-256 checksums

          **Beta build — use for testing.**
          EOF
          )

          echo "============================================"
          echo "PUBLISHING LATEST BETA RELEASE"
          echo "============================================"

          echo "Release tag:  $TAG"
          echo "Release name: $TITLE"
          echo "Indian time:  $IST_TIME"

          # --------------------------------------------------------
          # CREATE RELEASE IF IT DOES NOT EXIST.
          # OTHERWISE UPDATE THE SAME RELEASE.
          # --------------------------------------------------------
          if gh release view \
            "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1
          then

            echo ""
            echo "Existing beta release found."
            echo "Updating release assets..."

            gh release upload \
              "$TAG" \
              release/r1.upt \
              release/sonix_player \
              release/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

            gh release edit \
              "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES"

          else

            echo ""
            echo "Latest beta release does not exist."
            echo "Creating it..."

            gh release create \
              "$TAG" \
              release/r1.upt \
              release/sonix_player \
              release/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              --target "$GITHUB_SHA"

          fi

          echo ""
          echo "============================================"
          echo "LATEST BETA RELEASE PUBLISHED"
          echo "============================================"

          echo "Tag:          $TAG"
          echo "Build time:   $IST_TIME"
          echo "Commit:       $GITHUB_SHA"
          echo "Run:          $GITHUB_RUN_NUMBER"

      # ============================================================
      # FAILURE DIAGNOSTICS
      # ============================================================
      - name: Upload diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: hiby-r1-beta-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            sonix-player/.cache/rbdev-build/**/*.log
            sonix-player/.cache/rbdev-build/*.log
            sonix-packer/r1_original.upt
            sonix-packer/r1.upt
            sonix-packer/hiby-v1.6-download/**
          retention-days: 14
