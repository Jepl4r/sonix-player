name: Build Sonix Player R1 Firmware

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-r1:
    name: Build R1 Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            git \
            wget \
            curl \
            pkg-config \
            python3 \
            python3-pip \
            texinfo \
            bison \
            flex \
            bc \
            rsync \
            file \
            xz-utils \
            bzip2 \
            gzip \
            tar \
            p7zip-full \
            squashfs-tools \
            genisoimage \
            libasound2-dev

      # ============================================================
      # VERIFY PROJECT STRUCTURE
      # ============================================================
      - name: Verify project
        run: |
          set -eux

          test -f sonix-player/Makefile
          test -f sonix-packer/sonix_firmware_packer.sh
          test -d sonix-packer/assets/R1

          echo "Project structure:"
          find sonix-packer/assets/R1 -maxdepth 3 -type f | sort | head -100

      # ============================================================
      # BUILD SONIX PLAYER
      #
      # Makefile automatically:
      #   - builds Rockbox MIPS toolchain
      #   - builds FreeType
      #   - builds OGG
      #   - builds Opus
      #   - builds Opusfile
      #   - builds WavPack
      #   - builds sonix_player
      # ============================================================
      - name: Build Sonix Player
        working-directory: sonix-player
        run: |
          set -eux

          make target -j2

          test -f sonix_player

          file sonix_player

          echo "Sonix Player binary:"
          ls -lh sonix_player

      # ============================================================
      # PREPARE PACKER
      # ============================================================
      - name: Prepare firmware packer
        run: |
          set -eux

          chmod +x sonix-packer/sonix_firmware_packer.sh

          cp sonix-player/sonix_player \
             sonix-packer/sonix_player

          test -f sonix-packer/sonix_player

          echo "Files required by packer:"
          ls -lh sonix-packer/

      # ============================================================
      # CHECK STOCK R1 FIRMWARE
      # ============================================================
      - name: Check stock R1 firmware
        run: |
          set -eux

          if [ ! -f sonix-packer/r1_original.upt ]; then
            echo ""
            echo "============================================================"
            echo "ERROR: Missing stock R1 firmware"
            echo "============================================================"
            echo ""
            echo "The packer requires:"
            echo "  sonix-packer/r1_original.upt"
            echo ""
            echo "Place the official HiBy R1 stock firmware there."
            echo ""
            exit 1
          fi

          ls -lh sonix-packer/r1_original.upt

      # ============================================================
      # BUILD R1.UPT
      # ============================================================
      - name: Create R1 firmware
        working-directory: sonix-packer
        run: |
          set -eux

          ./sonix_firmware_packer.sh

          test -f r1.upt

          echo ""
          echo "============================================================"
          echo "R1 FIRMWARE CREATED"
          echo "============================================================"
          echo ""

          ls -lh r1.upt

          file r1.upt

      # ============================================================
      # VERIFY OUTPUT
      # ============================================================
      - name: Verify R1 firmware
        run: |
          set -eux

          test -s sonix-packer/r1.upt

          echo "Output:"
          ls -lh sonix-packer/r1.upt

      # ============================================================
      # UPLOAD BUILD ARTIFACT
      # ============================================================
      - name: Upload R1 firmware
        uses: actions/upload-artifact@v4
        with:
          name: sonix-player-r1-firmware
          path: |
            sonix-packer/r1.upt
            sonix-player/sonix_player
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # CREATE GITHUB RELEASE ON TAG
      # ============================================================
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sonix-packer/r1.upt
          generate_release_notes: true
