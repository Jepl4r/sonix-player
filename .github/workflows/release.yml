name: Build HiBy R1 Firmware

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hiby-r1-${{ github.ref }}
  cancel-in-progress: false

env:
  # ================================================================
  # HiBy R1 OFFICIAL V1.6 BASE FIRMWARE
  #
  # This is the Google Drive folder linked by HiBy's official
  # R1 Firmware V1.6 download page.
  # ================================================================
  HIBY_R1_V16_FOLDER: https://drive.google.com/drive/folders/1A2RIMdvuZRzGCNMY9F81vtGAAs2FJ46W?usp=sharing

  # ================================================================
  # ROCKBOX / R1 BUILD ENVIRONMENT
  # ================================================================
  RBDEV_HOST_PREFIX: ${{ github.workspace }}/sonix-player/rockbox-toolchain
  RBDEV_DOWNLOAD: ${{ github.workspace }}/sonix-player/.cache/rbdev-dl
  RBDEV_BUILD: ${{ github.workspace }}/sonix-player/.cache/rbdev-build

  MAKEFLAGS: -j2

  # ================================================================
  # RELEASE
  # ================================================================
  RELEASE_TAG: latest
  RELEASE_NAME: Latest Sonix Player R1 Firmware


jobs:

  build:
    name: Build HiBy R1 Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # INSTALL BUILD DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            autopoint \
            bc \
            bison \
            build-essential \
            bzip2 \
            ca-certificates \
            file \
            flex \
            genisoimage \
            gettext \
            gh \
            git \
            gzip \
            gtk-doc-tools \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            libtool \
            libtool-bin \
            make \
            p7zip-full \
            patch \
            pkg-config \
            python3 \
            python3-venv \
            rsync \
            squashfs-tools \
            tar \
            texinfo \
            unzip \
            wget \
            xz-utils

          echo
          echo "============================================"
          echo "BUILD ENVIRONMENT"
          echo "============================================"

          echo "OS:"
          lsb_release -ds

          echo
          echo "GCC:"
          gcc --version | head -1

          echo
          echo "MAKE:"
          make --version | head -1

          echo
          echo "PYTHON:"
          python3 --version

          echo
          echo "7-ZIP:"
          7z | head -2

          echo
          echo "SQUASHFS:"
          mksquashfs -version | head -2

          echo
          echo "ISO TOOL:"
          mkisofs --version | head -2


      # ============================================================
      # VERIFY PROJECT STRUCTURE
      # ============================================================

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f sonix-player/Makefile
          test -f sonix-player/rockboxdev/rockboxdev.sh

          test -d sonix-player/rockboxdev/toolchain-patches

          test -f sonix-packer/sonix_firmware_packer.sh
          test -d sonix-packer/assets/R1

          chmod +x sonix-player/rockboxdev/rockboxdev.sh
          chmod +x sonix-packer/sonix_firmware_packer.sh

          echo "Project structure verified."


      # ============================================================
      # RESTORE ROCKBOX TOOLCHAIN CACHE
      # ============================================================

      - name: Restore Rockbox toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            sonix-player/rockbox-toolchain
            sonix-player/.cache/rbdev-dl
            sonix-player/.cache/rbdev-build

          key: hiby-r1-toolchain-v1-${{ runner.os }}-${{ hashFiles('sonix-player/rockboxdev/rockboxdev.sh', 'sonix-player/rockboxdev/toolchain-patches/**') }}


      # ============================================================
      # RESTORE LIBRARY CACHE
      # ============================================================

      - name: Restore target library cache
        id: libraries-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            sonix-player/freetype-target
            sonix-player/audio-target
            sonix-player/freetype-2.13.3.tar.xz
            sonix-player/libogg-1.3.5.tar.gz
            sonix-player/opus-1.4.tar.gz
            sonix-player/opusfile-0.12.tar.gz
            sonix-player/wavpack-5.6.0.tar.bz2

          key: hiby-r1-libs-v1-${{ runner.os }}-${{ hashFiles('sonix-player/Makefile') }}


      # ============================================================
      # DOWNLOAD OFFICIAL HIBY R1 V1.6
      # ============================================================

      - name: Download official HiBy R1 v1.6
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================"
          echo "DOWNLOADING OFFICIAL HIBY R1 V1.6"
          echo "============================================"

          rm -rf sonix-packer/hiby-v1.6-download
          mkdir -p sonix-packer/hiby-v1.6-download

          python3 -m venv "$RUNNER_TEMP/gdown-env"

          "$RUNNER_TEMP/gdown-env/bin/python" \
            -m pip install --upgrade pip

          "$RUNNER_TEMP/gdown-env/bin/python" \
            -m pip install "gdown==6.4.0"

          echo
          echo "gdown version:"
          "$RUNNER_TEMP/gdown-env/bin/gdown" --version

          echo
          echo "Downloading HiBy R1 v1.6 folder..."

          "$RUNNER_TEMP/gdown-env/bin/gdown" \
            "$HIBY_R1_V16_FOLDER" \
            --output sonix-packer/hiby-v1.6-download \
            --folder

          echo
          echo "Downloaded files:"
          find sonix-packer/hiby-v1.6-download \
            -type f \
            -printf '%p\n' \
            | sort
      # ============================================================
      # EXTRACT / FIND r1.upt FROM V1.6
      # ============================================================

      - name: Prepare official R1 v1.6 r1.upt
        shell: bash
        run: |
          set -euo pipefail

          BASE_DIR="sonix-packer/hiby-v1.6-download"
          OUTPUT="sonix-packer/r1_original.upt"

          rm -f "$OUTPUT"

          echo
          echo "============================================"
          echo "LOCATING OFFICIAL R1 V1.6 r1.upt"
          echo "============================================"

          # ----------------------------------------------------------
          # Case 1: r1.upt downloaded directly
          # ----------------------------------------------------------

          DIRECT_UPT=$(find "$BASE_DIR" \
            -type f \
            \( -iname 'r1.upt' -o -iname 'R1.upt' \) \
            -print \
            -quit || true)

          if [ -n "$DIRECT_UPT" ]; then

            echo "Found direct r1.upt:"
            echo "$DIRECT_UPT"

            cp -f "$DIRECT_UPT" "$OUTPUT"

          else

            # --------------------------------------------------------
            # Case 2: ZIP contains r1.upt
            # --------------------------------------------------------

            ZIP_FILE=$(find "$BASE_DIR" \
              -type f \
              \( -iname '*.zip' -o -iname '*.ZIP' \) \
              -print \
              -quit || true)

            if [ -n "$ZIP_FILE" ]; then

              echo "Found firmware ZIP:"
              echo "$ZIP_FILE"

              rm -rf "$RUNNER_TEMP/hiby-r1-v16-extracted"
              mkdir -p "$RUNNER_TEMP/hiby-r1-v16-extracted"

              unzip -o "$ZIP_FILE" \
                -d "$RUNNER_TEMP/hiby-r1-v16-extracted"

              EXTRACTED_UPT=$(find \
                "$RUNNER_TEMP/hiby-r1-v16-extracted" \
                -type f \
                \( -iname 'r1.upt' -o -iname 'R1.upt' \) \
                -print \
                -quit || true)

              if [ -n "$EXTRACTED_UPT" ]; then

                echo "Found r1.upt inside ZIP:"
                echo "$EXTRACTED_UPT"

                cp -f "$EXTRACTED_UPT" "$OUTPUT"

              fi

            fi
          fi


          # ==========================================================
          # CASE 3: HiBy file downloaded as r1.upt.txt
          # ==========================================================

          if [ ! -s "$OUTPUT" ]; then

            TXT_UPT=$(find "$BASE_DIR" \
              -type f \
              \( -iname 'r1.upt.txt' -o -iname 'R1.upt.txt' \) \
              -print \
              -quit || true)

            if [ -n "$TXT_UPT" ]; then

              echo "Found r1.upt.txt:"
              echo "$TXT_UPT"

              cp -f "$TXT_UPT" "$OUTPUT"

            fi
          fi


          # ==========================================================
          # FINAL CHECK
          # ==========================================================

          if [ ! -s "$OUTPUT" ]; then

            echo
            echo "ERROR: Official HiBy R1 v1.6 r1.upt was not found."
            echo
            echo "Downloaded files:"
            find "$BASE_DIR" -type f -printf '%p\n' | sort

            exit 1
          fi


          # ==========================================================
          # BASIC VALIDATION
          # ==========================================================

          echo
          echo "============================================"
          echo "OFFICIAL HIBY R1 V1.6 FOUND"
          echo "============================================"

          ls -lh "$OUTPUT"

          echo
          echo "File type:"
          file "$OUTPUT"

          echo
          echo "SHA256:"
          sha256sum "$OUTPUT"

          echo
          echo "Size:"
          stat -c '%s bytes' "$OUTPUT"

          echo
          echo "Checking UPT contents..."

          7z l "$OUTPUT"

          echo
          echo "Checking OTA structure..."

          7z l "$OUTPUT" | grep -q 'ota_v0'

          echo
          echo "Official HiBy R1 v1.6 firmware is ready."


      # ============================================================
      # BUILD SONIX PLAYER
      # ============================================================

      - name: Build Sonix Player
        working-directory: sonix-player
        shell: bash
        run: |
          set -uo pipefail

          echo
          echo "============================================"
          echo "BUILDING SONIX PLAYER FOR HIBY R1"
          echo "============================================"

          make -j2 BOARD=r1 target

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "============================================"
            echo "SONIX PLAYER BUILD FAILED"
            echo "============================================"

            echo
            echo "Rockbox build logs:"

            find .cache/rbdev-build \
              -type f \
              -name '*.log' \
              -print 2>/dev/null || true

            for LOG in .cache/rbdev-build/build-*.log; do
              [ -f "$LOG" ] || continue

              echo
              echo "--------------------------------------------"
              echo "$LOG"
              echo "--------------------------------------------"

              tail -n 250 "$LOG" || true
            done

            exit "$STATUS"
          fi

          test -x sonix_player
          test -s sonix_player

          echo
          echo "============================================"
          echo "SONIX PLAYER BUILD SUCCESSFUL"
          echo "============================================"

          ls -lh sonix_player

          echo
          echo "Binary:"
          file sonix_player


      # ============================================================
      # SAVE TOOLCHAIN CACHE
      # ============================================================

      - name: Save Rockbox toolchain cache
        if: success() && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            sonix-player/rockbox-toolchain
            sonix-player/.cache/rbdev-dl
            sonix-player/.cache/rbdev-build

          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}


      # ============================================================
      # SAVE LIBRARY CACHE
      # ============================================================

      - name: Save target library cache
        if: success() && steps.libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            sonix-player/freetype-target
            sonix-player/audio-target
            sonix-player/freetype-2.13.3.tar.xz
            sonix-player/libogg-1.3.5.tar.gz
            sonix-player/opus-1.4.tar.gz
            sonix-player/opusfile-0.12.tar.gz
            sonix-player/wavpack-5.6.0.tar.bz2

          key: ${{ steps.libraries-cache.outputs.cache-primary-key }}


      # ============================================================
      # COPY PLAYER TO PACKER
      # ============================================================

      - name: Prepare Sonix Player for packer
        shell: bash
        run: |
          set -euo pipefail

          cp -f \
            sonix-player/sonix_player \
            sonix-packer/sonix_player

          chmod +x sonix-packer/sonix_player
          chmod +x sonix-packer/sonix_firmware_packer.sh

          test -s sonix-packer/sonix_player
          test -s sonix-packer/r1_original.upt

          echo
          echo "============================================"
          echo "PACKER INPUTS"
          echo "============================================"

          echo "Official base:"
          ls -lh sonix-packer/r1_original.upt

          echo
          echo "Sonix Player:"
          ls -lh sonix-packer/sonix_player

          echo
          echo "SHA256:"
          sha256sum \
            sonix-packer/r1_original.upt \
            sonix-packer/sonix_player


      # ============================================================
      # VERIFY PACKAGING TOOLS
      # ============================================================

      - name: Verify packaging tools
        shell: bash
        run: |
          set -euo pipefail

          for TOOL in \
            7z \
            unsquashfs \
            mksquashfs \
            split \
            tar \
            md5sum \
            sha256sum
          do
            command -v "$TOOL" >/dev/null || {
              echo "Missing tool: $TOOL"
              exit 1
            }
          done

          ISO_TOOL=""

          for TOOL in \
            mkisofs \
            genisoimage \
            xorrisofs
          do
            if command -v "$TOOL" >/dev/null 2>&1; then
              ISO_TOOL="$TOOL"
              break
            fi
          done

          test -n "$ISO_TOOL"

          echo "Packaging tools verified."
          echo "ISO writer: $ISO_TOOL"


      # ============================================================
      # BUILD CUSTOM R1.UPT
      # ============================================================

      - name: Build custom R1 firmware
        working-directory: sonix-packer
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================"
          echo "PACKING SONIX PLAYER INTO HIBY R1 V1.6"
          echo "============================================"

          ./sonix_firmware_packer.sh

          test -s r1.upt

          echo
          echo "============================================"
          echo "CUSTOM R1.UPT CREATED"
          echo "============================================"

          ls -lh r1.upt

          echo
          echo "File type:"
          file r1.upt

          echo
          echo "SHA256:"
          sha256sum r1.upt


      # ============================================================
      # VERIFY CUSTOM UPT
      # ============================================================

      - name: Verify custom R1 firmware
        working-directory: sonix-packer
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================"
          echo "VERIFYING CUSTOM R1.UPT"
          echo "============================================"

          test -f r1.upt
          test -s r1.upt

          SIZE=$(stat -c '%s' r1.upt)

          echo "Size: $SIZE bytes"

          if [ "$SIZE" -lt 1048576 ]; then
            echo "ERROR: r1.upt is unexpectedly small."
            exit 1
          fi

          echo
          echo "Package contents:"
          7z l r1.upt

          echo
          echo "Checking OTA directory..."

          7z l r1.upt | grep -q 'ota_v0'

          rm -rf "$RUNNER_TEMP/r1-verify"
          mkdir -p "$RUNNER_TEMP/r1-verify"

          7z x \
            r1.upt \
            -o"$RUNNER_TEMP/r1-verify" \
            -y \
            >/dev/null

          OTA_DIR="$RUNNER_TEMP/r1-verify/ota_v0"

          test -d "$OTA_DIR"

          echo
          echo "OTA files:"
          find "$OTA_DIR" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          # ota_update.in must exist.
          test -f "$OTA_DIR/ota_update.in"

          echo
          echo "ota_update.in:"
          cat "$OTA_DIR/ota_update.in"

          # Rootfs chunks must exist.
          ROOTFS_COUNT=$(
            find "$OTA_DIR" \
              -maxdepth 1 \
              -type f \
              -name 'rootfs.squashfs.*' \
              | wc -l
          )

          echo
          echo "Rootfs chunks: $ROOTFS_COUNT"

          if [ "$ROOTFS_COUNT" -lt 1 ]; then
            echo "ERROR: No rootfs chunks found."
            exit 1
          fi

          echo
          echo "Custom R1 firmware passed structural validation."


      # ============================================================
      # CREATE RELEASE DIRECTORY
      # ============================================================

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp -f \
            sonix-packer/r1.upt \
            release/r1.upt

          cp -f \
            sonix-player/sonix_player \
            release/sonix_player

          sha256sum \
            release/r1.upt \
            release/sonix_player \
            > release/SHA256SUMS

          echo
          echo "============================================"
          echo "RELEASE FILES"
          echo "============================================"

          ls -lh release

          echo
          cat release/SHA256SUMS


      # ============================================================
      # UPLOAD GITHUB ACTION ARTIFACT
      # ============================================================

      - name: Upload R1 firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: r1-firmware-${{ github.sha }}
          if-no-files-found: error
          path: |
            release/r1.upt
            release/SHA256SUMS
          retention-days: 30


      # ============================================================
      # UPLOAD PLAYER ARTIFACT
      # ============================================================

      - name: Upload Sonix Player artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonix-player-r1-${{ github.sha }}
          if-no-files-found: error
          path: |
            release/sonix_player
          retention-days: 30


      # ============================================================
      # PUBLISH LATEST RELEASE
      # ============================================================

      - name: Publish Latest R1 Firmware
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG}"
          TITLE="${RELEASE_NAME}"

          NOTES=$(cat <<EOF
          # Sonix Player for HiBy R1

          Automatically built from commit:

          \`${GITHUB_SHA}\`

          ## Base firmware

          Official HiBy R1 Firmware V1.6.

          ## Files

          - \`r1.upt\` — custom HiBy R1 firmware
          - \`sonix_player\` — Sonix Player executable
          - \`SHA256SUMS\` — checksums

          ## Build

          GitHub Actions run: ${GITHUB_RUN_NUMBER}
          EOF
          )

          echo
          echo "============================================"
          echo "PUBLISHING LATEST RELEASE"
          echo "============================================"

          if gh release view \
            "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1
          then

            echo "Updating existing release..."

            gh release upload \
              "$TAG" \
              release/r1.upt \
              release/sonix_player \
              release/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

            gh release edit \
              "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest

          else

            echo "Creating release..."

            gh release create \
              "$TAG" \
              release/r1.upt \
              release/sonix_player \
              release/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              --target "$GITHUB_SHA"

          fi

          echo
          echo "Latest firmware release published."


      # ============================================================
      # FAILURE DIAGNOSTICS
      # ============================================================

      - name: Upload diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: hiby-r1-build-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            sonix-player/.cache/rbdev-build/**/*.log
            sonix-player/.cache/rbdev-build/*.log
            sonix-packer/r1_original.upt
            sonix-packer/r1.upt
            sonix-packer/hiby-v1.6-download/**
          retention-days: 14
