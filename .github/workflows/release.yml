name: Build R1 Firmware

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build R1 Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # INSTALL BUILD DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            git \
            wget \
            curl \
            pkg-config \
            python3 \
            python3-pip \
            texinfo \
            bison \
            flex \
            bc \
            rsync \
            file \
            xz-utils \
            bzip2 \
            gzip \
            tar \
            p7zip-full \
            squashfs-tools \
            genisoimage \
            libasound2-dev \
            libtool \
            libtool-bin \
            autoconf \
            automake

          echo "Installed tool versions:"
          gcc --version | head -1
          make --version | head -1
          libtool --version | head -1

      # ============================================================
      # VERIFY PROJECT
      # ============================================================
      - name: Verify project
        run: |
          set -eux

          echo "Repository:"
          pwd

          echo ""
          echo "Top-level files:"
          ls -la

          test -f sonix-player/Makefile
          test -f sonix-packer/sonix_firmware_packer.sh
          test -d sonix-packer/assets/R1

          echo ""
          echo "R1 assets:"
          find sonix-packer/assets/R1 -maxdepth 4 -type f | sort

      # ============================================================
      # BUILD SONIX PLAYER
      # ============================================================
      - name: Build Sonix Player
        working-directory: sonix-player
        run: |
          set -eux

          echo "============================================"
          echo "Building Sonix Player"
          echo "============================================"

          make target -j2

          echo ""
          echo "Build completed."

          test -f sonix_player
          test -s sonix_player

          echo ""
          echo "Sonix Player binary:"
          ls -lh sonix_player
          file sonix_player

      # ============================================================
      # PREPARE PACKER
      # ============================================================
      - name: Prepare firmware packer
        run: |
          set -eux

          chmod +x sonix-packer/sonix_firmware_packer.sh

          cp sonix-player/sonix_player \
             sonix-packer/sonix_player

          test -f sonix-packer/sonix_player

          echo "Packer directory:"
          ls -lah sonix-packer

      # ============================================================
      # CHECK STOCK FIRMWARE
      # ============================================================
      - name: Check stock R1 firmware
        run: |
          set -eux

          if [ ! -f sonix-packer/r1_original.upt ]; then
            echo ""
            echo "============================================================"
            echo "ERROR: r1_original.upt is missing"
            echo "============================================================"
            echo ""
            echo "The firmware packer requires:"
            echo ""
            echo "  sonix-packer/r1_original.upt"
            echo ""
            echo "Add the official HiBy R1 stock firmware to that location."
            echo ""
            exit 1
          fi

          test -s sonix-packer/r1_original.upt

          echo "Stock firmware found:"
          ls -lh sonix-packer/r1_original.upt

      # ============================================================
      # CREATE R1.UPT
      # ============================================================
      - name: Create R1 firmware
        working-directory: sonix-packer
        run: |
          set -eux

          echo "============================================"
          echo "Creating R1 firmware"
          echo "============================================"

          ./sonix_firmware_packer.sh

          test -f r1.upt
          test -s r1.upt

          echo ""
          echo "============================================"
          echo "R1 FIRMWARE CREATED"
          echo "============================================"

          ls -lh r1.upt
          file r1.upt

      # ============================================================
      # VERIFY FINAL FIRMWARE
      # ============================================================
      - name: Verify firmware
        run: |
          set -eux

          test -f sonix-packer/r1.upt
          test -s sonix-packer/r1.upt

          echo "Final firmware:"
          ls -lh sonix-packer/r1.upt

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload R1 firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonix-player-r1-firmware
          path: |
            sonix-packer/r1.upt
            sonix-player/sonix_player
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # CREATE / UPDATE LATEST RELEASE
      #
      # Every successful push to main updates:
      #
      #   Latest R1 Firmware
      #
      # and replaces r1.upt with the newest build.
      # ============================================================
      - name: Publish Latest R1 Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest R1 Firmware
          body: |
            # Sonix Player — HiBy R1

            Automatically generated firmware from the latest successful `main` build.

            ## Firmware

            - `r1.upt` — HiBy R1 firmware

            ## Build

            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
            - Build: `${{ github.run_number }}`

            This release is automatically updated after every successful build.
          files: |
            sonix-packer/r1.upt
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
