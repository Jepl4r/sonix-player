name: Build R1 Firmware

concurrency:
  group: sonix-r1-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

env:
  # --------------------------------------------------------------
  # Rockbox toolchain locations used by this project's bundled
  # rockboxdev.sh.
  # --------------------------------------------------------------
  RBDEV_HOST_PREFIX: ${{ github.workspace }}/sonix-player/rockbox-toolchain
  RBDEV_DOWNLOAD: ${{ github.workspace }}/sonix-player/.cache/rbdev-dl
  RBDEV_BUILD: ${{ github.workspace }}/sonix-player/.cache/rbdev-build
  MAKEFLAGS: -j2

  # --------------------------------------------------------------
  # Base R1 firmware used as the input image by the packer.
  # This is separate from the release produced by this workflow.
  # --------------------------------------------------------------
  BASE_FIRMWARE_REPO: Starnished66/compas-player
  BASE_FIRMWARE_RELEASE: staging-image-base

  # Rolling release produced by this workflow.
  LATEST_RELEASE_TAG: latest

jobs:
  build:
    name: Build R1 Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # RESTORE ROCKBOX TOOLCHAIN + DOWNLOADED SOURCES
      # ============================================================
      - name: Restore Rockbox toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            sonix-player/rockbox-toolchain
            sonix-player/.cache/rbdev-dl
            sonix-player/.cache/rbdev-build
          key: sonix-r1-toolchain-v8-${{ runner.os }}-${{ hashFiles('sonix-player/rockboxdev/rockboxdev.sh', 'sonix-player/rockboxdev/toolchain-patches/**') }}

      # ============================================================
      # RESTORE TARGET LIBRARY CACHE
      # ============================================================
      - name: Restore target library cache
        id: libs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            sonix-player/freetype-target
            sonix-player/audio-target
            sonix-player/freetype-2.13.3.tar.xz
            sonix-player/libogg-1.3.5.tar.gz
            sonix-player/opus-1.4.tar.gz
            sonix-player/opusfile-0.12.tar.gz
            sonix-player/wavpack-5.6.0.tar.bz2
          key: sonix-r1-libs-v3-${{ runner.os }}-${{ hashFiles('sonix-player/Makefile') }}

      - name: Install build and packaging dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            autopoint \
            bc \
            bison \
            build-essential \
            bzip2 \
            ca-certificates \
            curl \
            file \
            flex \
            genisoimage \
            gettext \
            gh \
            git \
            gzip \
            gtk-doc-tools \
            libasound2-dev \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            libtool \
            libtool-bin \
            make \
            patch \
            p7zip-full \
            pkg-config \
            python3 \
            rsync \
            squashfs-tools \
            tar \
            texinfo \
            wget \
            xz-utils

          echo "============================================"
          echo "HOST ENVIRONMENT"
          echo "============================================"

          lsb_release -ds

          echo ""
          echo "GCC:"
          gcc --version

          echo ""
          echo "G++:"
          g++ --version

          echo ""
          echo "Make:"
          make --version

          echo ""
          echo "Python:"
          python3 --version

          echo ""
          echo "Autoconf:"
          autoconf --version

          echo ""
          echo "Automake:"
          automake --version

          echo ""
          echo "Libtool:"
          libtool --version

          echo ""
          echo "GTK Doc:"
          gtkdocize --version

          echo ""
          echo "Autoreconf:"
          autoreconf --version

          echo ""
          echo "GitHub CLI:"
          gh --version

          echo ""
          echo "GMP:"
          dpkg -s libgmp-dev | grep '^Version:'

          echo ""
          echo "MPFR:"
          dpkg -s libmpfr-dev | grep '^Version:'

          echo ""
          echo "MPC:"
          dpkg -s libmpc-dev | grep '^Version:'

      # ============================================================
      # VERIFY PROJECT STRUCTURE
      # ============================================================
      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          test -f sonix-player/Makefile
          test -f sonix-player/rockboxdev/rockboxdev.sh
          test -d sonix-player/rockboxdev/toolchain-patches

          test -f sonix-packer/sonix_firmware_packer.sh
          test -d sonix-packer/assets/R1

          chmod +x sonix-player/rockboxdev/rockboxdev.sh
          chmod +x sonix-packer/sonix_firmware_packer.sh

          echo "Project structure verified."

      # ============================================================
      # VERIFY GLIB 2.46.2 COMPATIBILITY WORKAROUND
      # ============================================================
      - name: Verify Rockbox GLib compatibility fix
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="sonix-player/rockboxdev/rockboxdev.sh"

          grep -q 'glib_ver="2.46.2"' "$SCRIPT"
          grep -q 'm4_copy_force' "$SCRIPT"
          grep -q 'autoreconf -fiv' "$SCRIPT"
          grep -q -- '--disable-gtk-doc' "$SCRIPT"

          echo "GLib 2.46.2 compatibility workaround verified."

      # ============================================================
      # REPORT CACHE STATUS
      # ============================================================
      - name: Report cache status
        shell: bash
        run: |
          set -euo pipefail

          echo "Toolchain cache hit: ${{ steps.toolchain-cache.outputs.cache-hit }}"
          echo "Library cache hit:    ${{ steps.libs-cache.outputs.cache-hit }}"

          if [ -x "sonix-player/rockbox-toolchain/bin/mipsel-rockbox-linux-gnu-gcc" ]; then
            echo ""
            echo "Cached cross compiler found:"
            sonix-player/rockbox-toolchain/bin/mipsel-rockbox-linux-gnu-gcc --version | head -1
          else
            echo ""
            echo "No cached cross compiler found."
            echo "rockboxdev.sh will build the toolchain."
          fi

      # ============================================================
      # BUILD SONIX PLAYER
      # ============================================================
      - name: Build Sonix Player
        working-directory: sonix-player
        shell: bash
        run: |
          set -uo pipefail

          echo "============================================"
          echo "BUILDING SONIX PLAYER FOR HIBY R1"
          echo "============================================"

          make BOARD=r1 target
          status=$?

          if [ "$status" -ne 0 ]; then
            echo ""
            echo "============================================"
            echo "ROCKBOX BUILD FAILED"
            echo "============================================"
            echo ""

            echo "Available Rockbox logs:"
            find .cache/rbdev-build \
              -type f \
              -name '*.log' \
              -print 2>/dev/null || true

            for log in .cache/rbdev-build/build-*.log; do
              [ -f "$log" ] || continue

              echo ""
              echo "---------------- $log ----------------"
              tail -n 200 "$log" || true
            done

            exit "$status"
          fi

          test -x sonix_player
          test -s sonix_player

          echo ""
          echo "============================================"
          echo "SONIX PLAYER BUILD SUCCESSFUL"
          echo "============================================"

          ls -lh sonix_player
          file sonix_player

      # ============================================================
      # SAVE TOOLCHAIN CACHE ONLY AFTER A SUCCESSFUL BUILD
      # ============================================================
      - name: Save Rockbox toolchain cache
        if: success() && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            sonix-player/rockbox-toolchain
            sonix-player/.cache/rbdev-dl
            sonix-player/.cache/rbdev-build
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      # ============================================================
      # SAVE TARGET LIBRARY CACHE
      # ============================================================
      - name: Save target library cache
        if: success() && steps.libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            sonix-player/freetype-target
            sonix-player/audio-target
            sonix-player/freetype-2.13.3.tar.xz
            sonix-player/libogg-1.3.5.tar.gz
            sonix-player/opus-1.4.tar.gz
            sonix-player/opusfile-0.12.tar.gz
            sonix-player/wavpack-5.6.0.tar.bz2
          key: ${{ steps.libs-cache.outputs.cache-primary-key }}

      # ============================================================
      # VERIFY TARGET ELF
      # ============================================================
      - name: Verify target binary
        working-directory: sonix-player
        shell: bash
        run: |
          set -euo pipefail

          test -x sonix_player
          test -s sonix_player

          file sonix_player

          rockbox-toolchain/bin/mipsel-rockbox-linux-gnu-readelf \
            -h sonix_player \
            | grep -E 'Class:|Data:|Machine:'

          rockbox-toolchain/bin/mipsel-rockbox-linux-gnu-readelf \
            --version-info sonix_player \
            > /tmp/sonix-readelf-version-info.txt || true

      # ============================================================
      # PREPARE FIRMWARE PACKER
      # ============================================================
      - name: Prepare firmware packer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p sonix-packer/release

          cp -f \
            sonix-player/sonix_player \
            sonix-packer/sonix_player

          chmod +x sonix-packer/sonix_player
          chmod +x sonix-packer/sonix_firmware_packer.sh

          # --------------------------------------------------------
          # Download the base R1 firmware automatically.
          # The downloaded r1.upt becomes r1_original.upt for the
          # packer.
          # --------------------------------------------------------
          rm -f sonix-packer/r1_original.upt

          gh release download "$BASE_FIRMWARE_RELEASE" \
            --repo "$BASE_FIRMWARE_REPO" \
            --pattern 'r1.upt' \
            --dir sonix-packer \
            --clobber

          mv -f \
            sonix-packer/r1.upt \
            sonix-packer/r1_original.upt

          test -s sonix-packer/r1_original.upt
          test -s sonix-packer/sonix_player

          echo "============================================"
          echo "PACKER INPUTS"
          echo "============================================"

          file sonix-packer/r1_original.upt

          ls -lh \
            sonix-packer/r1_original.upt \
            sonix-packer/sonix_player

      # ============================================================
      # VERIFY PACKAGING TOOLS
      # ============================================================
      - name: Verify firmware packaging tools
        shell: bash
        run: |
          set -euo pipefail

          for tool in \
            7z \
            unsquashfs \
            mksquashfs \
            split \
            tar
          do
            command -v "$tool" >/dev/null || {
              echo "Missing packaging tool: $tool"
              exit 1
            }
          done

          ISO_TOOL=""

          for tool in \
            mkisofs \
            genisoimage \
            xorrisofs
          do
            if command -v "$tool" >/dev/null 2>&1; then
              ISO_TOOL="$tool"
              break
            fi
          done

          test -n "$ISO_TOOL"

          echo "Using ISO writer: $ISO_TOOL"

      # ============================================================
      # CREATE R1.UPT
      # ============================================================
      - name: Build R1 firmware
        working-directory: sonix-packer
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================"
          echo "CREATING R1.UPT"
          echo "============================================"

          ./sonix_firmware_packer.sh

          test -s r1.upt

          echo ""
          echo "============================================"
          echo "R1.UPT CREATED SUCCESSFULLY"
          echo "============================================"

          ls -lh r1.upt
          file r1.upt

      # ============================================================
      # GENERATE RELEASE FILES
      # ============================================================
      - name: Generate release files
        shell: bash
        run: |
          set -euo pipefail

          cp -f \
            sonix-packer/r1.upt \
            sonix-packer/release/r1.upt

          cp -f \
            sonix-player/sonix_player \
            sonix-packer/release/sonix_player

          cp -f \
            /tmp/sonix-readelf-version-info.txt \
            sonix-packer/release/sonix-readelf-version-info.txt

          sha256sum \
            sonix-packer/release/r1.upt \
            sonix-packer/release/sonix_player \
            > sonix-packer/release/SHA256SUMS

          echo "============================================"
          echo "RELEASE FILES"
          echo "============================================"

          ls -lh sonix-packer/release

          echo ""
          echo "Checksums:"
          cat sonix-packer/release/SHA256SUMS

      # ============================================================
      # UPLOAD GITHUB ACTION ARTIFACT
      # ============================================================
      - name: Upload R1 firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: r1-firmware-${{ github.sha }}
          if-no-files-found: error
          path: |
            sonix-packer/release/r1.upt
            sonix-packer/release/SHA256SUMS
          retention-days: 30

      # ============================================================
      # UPLOAD PLAYER BINARY ARTIFACT
      # ============================================================
      - name: Upload Sonix Player binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonix-player-r1-${{ github.sha }}
          if-no-files-found: error
          path: |
            sonix-packer/release/sonix_player
            sonix-packer/release/sonix-readelf-version-info.txt
          retention-days: 30

      # ============================================================
      # CREATE / UPDATE LATEST R1 FIRMWARE RELEASE
      #
      # Release tag:
      #   latest
      #
      # Release:
      #   Latest R1 Firmware
      #
      # Files:
      #   r1.upt
      #   SHA256SUMS
      # ============================================================
      - name: Publish Latest R1 Firmware
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="$LATEST_RELEASE_TAG"
          TITLE="Latest R1 Firmware"

          NOTES=$(cat <<EOF
          # Sonix Player — HiBy R1

          Automatically generated from the latest successful main build.

          ## Files

          - r1.upt — firmware image for HiBy R1
          - SHA256SUMS — SHA-256 checksums

          ## Build

          - Commit: ${GITHUB_SHA}
          - Run: ${GITHUB_RUN_NUMBER}

          This release is updated automatically after each successful build.
          EOF
          )

          if gh release view \
            "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1
          then
            echo "Updating existing $TAG release..."

            gh release upload \
              "$TAG" \
              sonix-packer/release/r1.upt \
              sonix-packer/release/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

            gh release edit \
              "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest

          else
            echo "Creating $TAG release..."

            gh release create \
              "$TAG" \
              sonix-packer/release/r1.upt \
              sonix-packer/release/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              --target "$GITHUB_SHA"
          fi

          echo ""
          echo "============================================"
          echo "LATEST R1 RELEASE PUBLISHED"
          echo "============================================"

      # ============================================================
      # UPLOAD DIAGNOSTICS IF ANY STEP FAILS
      # ============================================================
      - name: Upload build diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: r1-build-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            sonix-player/.cache/rbdev-build/*.log
            sonix-player/.cache/rbdev-build/**/*.log
            sonix-packer/release
          retention-days: 14
