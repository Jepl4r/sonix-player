name: Build R1 Firmware

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build R1 Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # INSTALL BUILD DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            git \
            wget \
            curl \
            pkg-config \
            python3 \
            python3-pip \
            texinfo \
            bison \
            flex \
            bc \
            rsync \
            file \
            xz-utils \
            bzip2 \
            gzip \
            tar \
            p7zip-full \
            squashfs-tools \
            genisoimage \
            libasound2-dev \
            libtool \
            libtool-bin \
            autoconf \
            automake \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev

          echo ""
          echo "============================================"
          echo "BUILD ENVIRONMENT"
          echo "============================================"

          echo "Ubuntu:"
          lsb_release -ds

          echo ""
          echo "GCC:"
          gcc --version | head -1

          echo ""
          echo "Make:"
          make --version | head -1

          echo ""
          echo "Python:"
          python3 --version

          echo ""
          echo "Libtool:"
          libtool --version | head -1

          echo ""
          echo "GMP:"
          dpkg -s libgmp-dev | grep '^Version:'

          echo ""
          echo "MPFR:"
          dpkg -s libmpfr-dev | grep '^Version:'

          echo ""
          echo "MPC:"
          dpkg -s libmpc-dev | grep '^Version:'

      # ============================================================
      # VERIFY PROJECT
      # ============================================================
      - name: Verify project
        run: |
          set -eux

          echo "============================================"
          echo "VERIFY PROJECT"
          echo "============================================"

          test -f sonix-player/Makefile
          test -f sonix-player/rockboxdev/rockboxdev.sh
          test -f sonix-packer/sonix_firmware_packer.sh
          test -d sonix-packer/assets/R1

          chmod +x sonix-player/rockboxdev/rockboxdev.sh
          chmod +x sonix-packer/sonix_firmware_packer.sh

          echo ""
          echo "Project structure:"
          find . \
            -path './.git' -prune -o \
            -path './__MACOSX' -prune -o \
            -maxdepth 3 \
            -type f \
            -print | sort | head -200

      # ============================================================
      # SHOW ROCKBOX BUILD CONFIGURATION
      # ============================================================
      - name: Check Rockbox configuration
        working-directory: sonix-player
        run: |
          set -eux

          echo "============================================"
          echo "ROCKBOX CONFIGURATION"
          echo "============================================"

          grep -n \
            -E 'glib_ver|glibc_ver|gcc_ver|binutils_ver|mpc|mpfr' \
            rockboxdev/rockboxdev.sh || true

          echo ""
          echo "GLib compatibility code:"
          sed -n '275,295p' rockboxdev/rockboxdev.sh

      # ============================================================
      # BUILD SONIX PLAYER
      #
      # The Makefile automatically:
      #
      #   1. Builds the Rockbox MIPS toolchain
      #   2. Builds FreeType
      #   3. Builds libogg
      #   4. Builds libopus
      #   5. Builds opusfile
      #   6. Builds WavPack
      #   7. Builds Sonix Player
      #
      # IMPORTANT:
      # Do not manually invoke rockboxdev.sh here.
      # The Makefile handles the dependency chain.
      # ============================================================
      - name: Build Sonix Player
        working-directory: sonix-player
        run: |
          set -eux

          echo "============================================"
          echo "BUILDING SONIX PLAYER"
          echo "============================================"

          make target -j2

          echo ""
          echo "============================================"
          echo "SONIX PLAYER BUILD COMPLETE"
          echo "============================================"

          test -f sonix_player
          test -s sonix_player

          echo ""
          echo "Binary:"
          ls -lh sonix_player

          echo ""
          echo "File:"
          file sonix_player

      # ============================================================
      # PREPARE FIRMWARE PACKER
      # ============================================================
      - name: Prepare firmware packer
        run: |
          set -eux

          echo "============================================"
          echo "PREPARING FIRMWARE PACKER"
          echo "============================================"

          chmod +x sonix-packer/sonix_firmware_packer.sh

          cp \
            sonix-player/sonix_player \
            sonix-packer/sonix_player

          test -f sonix-packer/sonix_player
          test -s sonix-packer/sonix_player

          echo ""
          echo "Packer directory:"
          ls -lah sonix-packer

      # ============================================================
      # CHECK STOCK R1 FIRMWARE
      # ============================================================
      - name: Check stock R1 firmware
        run: |
          set -eux

          echo "============================================"
          echo "CHECKING STOCK R1 FIRMWARE"
          echo "============================================"

          if [ ! -f sonix-packer/r1_original.upt ]; then
            echo ""
            echo "============================================================"
            echo "ERROR: Missing r1_original.upt"
            echo "============================================================"
            echo ""
            echo "The firmware packer requires:"
            echo ""
            echo "    sonix-packer/r1_original.upt"
            echo ""
            echo "Add the original HiBy R1 firmware to the repository."
            echo ""
            exit 1
          fi

          if [ ! -s sonix-packer/r1_original.upt ]; then
            echo ""
            echo "ERROR: r1_original.upt exists but is empty."
            echo ""
            exit 1
          fi

          echo "Stock firmware found:"
          ls -lh sonix-packer/r1_original.upt

      # ============================================================
      # CREATE R1.UPT
      # ============================================================
      - name: Create R1 firmware
        working-directory: sonix-packer
        run: |
          set -eux

          echo "============================================"
          echo "CREATING R1.UPT"
          echo "============================================"

          ./sonix_firmware_packer.sh

          test -f r1.upt
          test -s r1.upt

          echo ""
          echo "============================================"
          echo "R1.UPT CREATED SUCCESSFULLY"
          echo "============================================"

          echo ""
          echo "Firmware:"
          ls -lh r1.upt

          echo ""
          echo "File information:"
          file r1.upt

      # ============================================================
      # VERIFY FINAL OUTPUT
      # ============================================================
      - name: Verify firmware
        run: |
          set -eux

          echo "============================================"
          echo "FINAL VERIFICATION"
          echo "============================================"

          test -f sonix-packer/r1.upt
          test -s sonix-packer/r1.upt

          echo ""
          echo "R1 firmware:"
          ls -lh sonix-packer/r1.upt

          echo ""
          echo "Sonix Player:"
          ls -lh sonix-player/sonix_player

      # ============================================================
      # UPLOAD GITHUB ACTION ARTIFACT
      # ============================================================
      - name: Upload R1 firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonix-player-r1-firmware
          path: |
            sonix-packer/r1.upt
            sonix-player/sonix_player
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # PUBLISH LATEST RELEASE
      #
      # Every successful build of main updates:
      #
      #     Latest R1 Firmware
      #
      # Release tag:
      #
      #     latest
      #
      # Asset:
      #
      #     r1.upt
      # ============================================================
      - name: Publish Latest R1 Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest R1 Firmware

          body: |
            # Sonix Player — HiBy R1

            Automatically generated firmware from the latest
            successful `main` branch build.

            ## Firmware

            `r1.upt`

            ## Build Information

            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
            - Build: `${{ github.run_number }}`

            This release is automatically updated after every
            successful build.

          files: |
            sonix-packer/r1.upt

          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
