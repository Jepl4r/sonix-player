btaudio_codecs = Codecs
btaudio_title = Áudio Bluetooth
btaudio_synchronised_volume = Volume sincronizado
airpods = AirPods
airpods_battery_reading = Verificando nível da bateria…
btaudio_aac_mode = AAC
btaudio_aac_mode_note = O VBR usa os bits onde a música precisa e só é usado com fones que o suportam. Escolha CBR se um fone engasgar com AAC. Alterar reconecta os fones.
btaudio_sample_rate = Taxa de amostragem
btaudio_rate_auto = Auto (48 kHz)
btaudio_sample_rate_note = A maioria das músicas está em 44,1 kHz e os fones costumam funcionar a 48 kHz, então no Auto cada faixa é reamostrada antes do envio; em 44,1 kHz ela é enviada como está. Seguir a música ajusta o link à família de cada faixa, entre uma faixa e outra: 44,1 ou 88,2 kHz para arquivos da família CD, 48 ou 96 kHz para os demais. 96 kHz é para LDAC; os outros codecs ficam no Auto. Mudar para 44,1 kHz ou sair dele reconecta os fones.
btaudio_keep_on = Manter o Bluetooth ligado
btaudio_keep_on_note = Por quanto tempo o Bluetooth continua ligado, sem uso, depois que a tela apaga. Mais tempo faz os fones recolocados após uma pausa reconectarem na hora, com um pequeno gasto de bateria; um tempo maior que o atraso do modo de espera também adia o modo de espera até terminar.
btaudio_ldac_wifi_busy = O Wi-Fi está baixando. O LDAC a 990 kbps divide o rádio com ele e pode falhar enquanto isso; o ABR se ajusta sozinho.
btaudio_ldac_wifi_transfer = A transferência por Wi-Fi está ligada, então a partir da próxima conexão o LDAC usa 660 kbps em vez de 990, para deixar espaço ao Wi-Fi. O 990 volta quando a transferência for desligada.
btaudio_codec_auto = Automático
btaudio_battery = Bateria
btaudio_headset_battery = Bateria do fone (usa HFP)
btaudio_headset_battery_note = Mostra o nível de bateria dos fones que o informam. O player passa a oferecer também o perfil viva-voz, mas nunca o usa para chamadas ou microfone. Alguns fones preferem o viva-voz e podem soar pior: nesses, deixe desligado. Aplicado quando nada está tocando.
btaudio_codec_changed = Codec alterado: %s → %s
btaudio_rate_follow = Seguir a música

