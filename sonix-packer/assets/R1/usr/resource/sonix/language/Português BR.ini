; --- btaudio.c
btaudio_nowplaying_details = Mostrar detalhes no Tocando Agora
btaudio_nowplaying_details_note = Uma linha abaixo do artista mostra o que os fones recebem, como LDAC 990 · 48 kHz, e se a faixa é reamostrada no caminho, como 44.1 → 48 kHz.
