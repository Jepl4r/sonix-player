btaudio_aac_mode = AAC
btaudio_aac_mode_note = VBR spends the bits where the music needs them and is used only with headphones that support it. Choose CBR if a pair stutters on AAC. Changing it reconnects the headphones.
btaudio_sample_rate = Sample rate
btaudio_rate_auto = Auto (48 kHz)
btaudio_sample_rate_note = Most music is 44.1 kHz and headphones usually run at 48 kHz, so on Auto every track is resampled before it is sent; 44.1 kHz sends it as it is. Follow the music sets the link to each track's family between tracks: 44.1 or 88.2 kHz for CD-family files, 48 or 96 kHz for the others. 96 kHz is for LDAC; other codecs stay on Auto. Switching to or from 44.1 kHz reconnects the headphones.
btaudio_keep_on = Keep Bluetooth on
btaudio_keep_on_note = How long Bluetooth stays on, unused, after the screen goes dark. Longer lets headphones put back on after a pause reconnect at once, at a small cost in battery; a time longer than the standby delay also holds standby off until it runs out.
btaudio_ldac_wifi_busy = Wi-Fi is downloading. LDAC at 990 kbps shares the radio with it and may drop out meanwhile; ABR copes by itself.
btaudio_ldac_wifi_transfer = Wi-Fi transfer is on, so LDAC uses 660 kbps instead of 990 from the next connection, to leave room for Wi-Fi. 990 comes back once transfer is off.
btaudio_codec_auto = Auto
btaudio_battery = Battery
btaudio_headset_battery = Headphone battery (uses HFP)
btaudio_headset_battery_note = Shows the battery level of any headphones that report it. The player then also offers the hands-free profile; it never uses it for calls or the microphone. A few headphones prefer hands-free and may sound worse with it on: switch it off for those. Applied when nothing is playing.
btaudio_codec_changed = Codec changed: %s → %s
btaudio_rate_follow = Follow the music

