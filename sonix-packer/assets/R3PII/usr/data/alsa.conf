# Sonix Player ALSA configuration.
# libasound on this firmware uses /usr/data/alsa.conf as its main file.
# Keep the stock definitions, including the parameterized pcm.bluealsa PCM.
# The wired default bypasses card definitions missing from /usr/data/cards.
</usr/share/alsa/alsa.conf>
pcm.!default {
	type plug
	slave.pcm "hw:0,0"
}
ctl.!default {
	type hw
	card 0
}
